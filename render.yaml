services:
  # Express API server
  - type: web
    name: scalecases-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    # Persistent disk: shared browser state, leads ledger, FB cache, snapshots and pacing
    # all live under DATA_DIR and would otherwise be wiped on every deploy.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: CLIENT_URL
        sync: false  # Set this to your frontend Render URL after first deploy
      - key: FB_ACCESS_TOKEN
        sync: false
      - key: FB_AD_ACCOUNTS
        sync: false
      - key: GHL_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SHEETS_ID
        sync: false
      - key: SHEETS_TAB_NAME
        sync: false
      - key: SHEETS_STATE_COL
        sync: false
      - key: MONTHLY_CASES_SHEET_ID
        sync: false  # Spreadsheet ID containing monthly tabs
      - key: MONTHLY_CASES_TAB
        sync: false  # Tab name to import, e.g. "March Signed Cases"
      - key: SPEND_SHEET_ID
        sync: false  # Spreadsheet ID for the spend-by-state monthly grid (one tab per month)
      - key: TELEGRAM_BOT_TOKEN
        sync: false  # From @BotFather — enables digest delivery to Telegram
      - key: TELEGRAM_CHAT_ID
        sync: false  # Your Telegram chat id (message @userinfobot to get it)
      - key: DIGEST_TIMES
        sync: false  # e.g. "07:30,16:00" (in DIGEST_TZ); "off" disables the schedule
      - key: DIGEST_TZ
        sync: false  # e.g. America/Los_Angeles
      - key: FB_WRITE_TOKEN
        sync: false  # ads_management token from the separate unpublished app (kill commands only)

  # React frontend (static site)
  - type: web
    name: scalecases-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false  # Set this to your backend Render URL after first deploy

  # ── Term Life niche site: Ads Tracking + Spend Sheet for its own ad accounts only ──
  - type: web
    name: scalecases-term-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: data-term
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NICHE
        value: term
      - key: DATA_DIR
        value: /var/data
      - key: CLIENT_URL
        value: https://scalecases-term.onrender.com
      - key: FB_AD_ACCOUNTS
        value: "29300658139571561"
      # FB_ACCESS_TOKEN, FB_WRITE_TOKEN and APP_PASSWORD, same values as the law server
      - fromGroup: scalecases-shared

  - type: web
    name: scalecases-term
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_NICHE
        value: term
      - key: VITE_API_URL
        value: https://scalecases-term-server.onrender.com

  # ── Final Expense niche site: Ads Tracking + Spend Sheet for its own ad accounts only ──
  - type: web
    name: scalecases-fex-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: data-fex
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NICHE
        value: fex
      - key: DATA_DIR
        value: /var/data
      - key: CLIENT_URL
        value: https://scalecases-fex.onrender.com
      - key: FB_AD_ACCOUNTS
        value: "1463445865879047"
      # FB_ACCESS_TOKEN, FB_WRITE_TOKEN and APP_PASSWORD, same values as the law server
      - fromGroup: scalecases-shared

  - type: web
    name: scalecases-fex
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_NICHE
        value: fex
      - key: VITE_API_URL
        value: https://scalecases-fex-server.onrender.com
